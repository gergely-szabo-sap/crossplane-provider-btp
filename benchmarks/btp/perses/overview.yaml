kind: Dashboard
metadata:
    name: overview
    project: btp
spec:
    display:
        name: overview
    panels:
        "0_0":
            kind: Panel
            spec:
                display:
                    name: Last-observed lifecycle iteration duration
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            position: bottom
                        yAxis:
                            format:
                                unit: milliseconds
                            label: ""
                            show: true
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: xp_diadromos_k6_iteration_duration_mean{scenario="create_delete"}
                                seriesNameFormat: '{{archive_filename}}'
        "0_1":
            kind: Panel
            spec:
                display:
                    name: Completed lifecycle iterations
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            position: bottom
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: xp_diadromos_k6_iterations_total{scenario="create_delete"}
                                seriesNameFormat: '{{archive_filename}}'
        "1_0":
            kind: Panel
            spec:
                display:
                    name: Container CPU usage (cores)
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            position: bottom
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (pod, container, archive_filename) (xp_diadromos_container_cpu_usage_cores{job="resource"})
                                seriesNameFormat: '{{pod}} / {{container}} ({{archive_filename}})'
        "1_1":
            kind: Panel
            spec:
                display:
                    name: Container memory usage
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            position: bottom
                        yAxis:
                            format:
                                unit: bytes
                            label: ""
                            show: true
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (pod, container, archive_filename) (xp_diadromos_container_memory_usage_bytes{job="resource"})
                                seriesNameFormat: '{{pod}} / {{container}} ({{archive_filename}})'
        "2_0":
            kind: Panel
            spec:
                display:
                    name: Last-observed time to Ready (client-observed)
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            position: bottom
                        yAxis:
                            format:
                                unit: milliseconds
                            label: ""
                            show: true
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: xp_diadromos_k6_xp_time_to_ready_mean{scenario="create_delete"}
                                seriesNameFormat: '{{resource_kind}} ({{archive_filename}})'
        "2_2":
            kind: Panel
            spec:
                display:
                    name: Last-observed time until Kubernetes object absence (client-observed)
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            position: bottom
                        yAxis:
                            format:
                                unit: milliseconds
                            label: ""
                            show: true
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: xp_diadromos_k6_xp_time_to_delete_mean{scenario="create_delete"}
                                seriesNameFormat: '{{resource_kind}} ({{archive_filename}})'
        "3_0":
            kind: Panel
            spec:
                display:
                    name: Reconciliations per second
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            position: bottom
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (controller, archive_filename) (rate(controller_runtime_reconcile_total{job="provider"}[1m]))
                                seriesNameFormat: '{{controller}} ({{archive_filename}})'
        "3_1":
            kind: Panel
            spec:
                display:
                    name: Reconcile errors per second
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            position: bottom
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (controller, archive_filename) (rate(controller_runtime_reconcile_errors_total{job="provider"}[1m]))
                                seriesNameFormat: '{{controller}} ({{archive_filename}})'
    layouts:
        - kind: Grid
          spec:
            display:
                title: k6
                collapse:
                    open: true
            items:
                - x: 0
                  "y": 0
                  width: 12
                  height: 8
                  content:
                    $ref: '#/spec/panels/0_0'
                - x: 12
                  "y": 0
                  width: 12
                  height: 8
                  content:
                    $ref: '#/spec/panels/0_1'
        - kind: Grid
          spec:
            display:
                title: Resource utilization
                collapse:
                    open: true
            items:
                - x: 0
                  "y": 0
                  width: 12
                  height: 8
                  content:
                    $ref: '#/spec/panels/1_0'
                - x: 12
                  "y": 0
                  width: 12
                  height: 8
                  content:
                    $ref: '#/spec/panels/1_1'
        - kind: Grid
          spec:
            display:
                title: Lifecycle latency
                collapse:
                    open: true
            items:
                - x: 0
                  "y": 0
                  width: 12
                  height: 8
                  content:
                    $ref: '#/spec/panels/2_0'
                - x: 12
                  "y": 0
                  width: 12
                  height: 8
                  content:
                    $ref: '#/spec/panels/2_2'
        - kind: Grid
          spec:
            display:
                title: Provider
                collapse:
                    open: true
            items:
                - x: 0
                  "y": 0
                  width: 12
                  height: 8
                  content:
                    $ref: '#/spec/panels/3_0'
                - x: 12
                  "y": 0
                  width: 12
                  height: 8
                  content:
                    $ref: '#/spec/panels/3_1'
    duration: 1h
    refreshInterval: 0s
