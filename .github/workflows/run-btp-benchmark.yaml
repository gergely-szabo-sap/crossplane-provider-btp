name: BTP synthetic benchmark

on:
  workflow_dispatch:
    inputs:
      confirm_dedicated_account:
        description: Confirm the dedicated BTP benchmark account is configured and safe to use
        required: true
        type: boolean
        default: false
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: btp-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  approve:
    if: ${{ github.event_name == 'pull_request_target' && !github.event.pull_request.draft && github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && 'pr-e2e-no-approval' || 'pr-e2e-approval' }}
      deployment: false
    steps:
      - run: echo "Approval gate passed"

  benchmark:
    needs: approve
    if: ${{ always() && (needs.approve.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.approve.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: pr-e2e-no-approval
      deployment: false
    env:
      VERSION: v0.0.0-${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
      BUILD_REGISTRY: provider-btp-benchmark
      PLATFORMS: linux_amd64
    steps:
      - name: Enforce trusted dispatch ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/${{ github.event.repository.default_branch }}" ]] || {
            echo '::error::Manual benchmark dispatch is allowed only from the default branch.'; exit 1;
          }
          [[ "${{ inputs.confirm_dedicated_account }}" == "true" ]] || {
            echo '::error::Confirm the dedicated BTP benchmark account before dispatch.'; exit 1;
          }

      - name: Validate approved PR revision
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "$DEFAULT_BRANCH" --arg sha "$EXPECTED_SHA" \
            '.state == "open" and .base.repo.full_name == $repo and .base.ref == $branch and .head.sha == $sha' \
            <<<"$pr" >/dev/null || {
              echo '::error::The approved PR head changed or no longer targets the default branch; wait for a fresh workflow run and approval.'; exit 1;
            }

      - name: Validate benchmark account configuration
        env:
          GLOBAL_ACCOUNT: ${{ vars.GLOBAL_ACCOUNT }}
          CLI_SERVER_URL: ${{ vars.CLI_SERVER_URL }}
          TECHNICAL_USER_EMAIL: ${{ secrets.TECHNICAL_USER_EMAIL }}
          SECOND_DIRECTORY_ADMIN_EMAIL: ${{ secrets.SECOND_DIRECTORY_ADMIN_EMAIL }}
          BTP_ENV_COMPARE_HMAC_KEY: ${{ secrets.BTP_ENV_COMPARE_HMAC_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$GLOBAL_ACCOUNT" ]] || {
            echo '::error::Configure the GLOBAL_ACCOUNT environment variable to the dedicated global account subdomain.'; exit 1;
          }
          [[ -n "$CLI_SERVER_URL" ]] || {
            echo '::error::Configure the CLI_SERVER_URL environment variable for the benchmark BTP environment.'; exit 1;
          }
          [[ "$CLI_SERVER_URL" == https://* ]] || {
            echo '::error::CLI_SERVER_URL must be an HTTPS URL.'; exit 1;
          }
          [[ -n "$TECHNICAL_USER_EMAIL" ]] || {
            echo '::error::Configure the TECHNICAL_USER_EMAIL secret for the benchmark environment.'; exit 1;
          }
          [[ -n "$SECOND_DIRECTORY_ADMIN_EMAIL" ]] || {
            echo '::error::Configure the SECOND_DIRECTORY_ADMIN_EMAIL secret for the benchmark environment.'; exit 1;
          }
          [[ "$BTP_ENV_COMPARE_HMAC_KEY" =~ ^[[:xdigit:]]{64}$ ]] || {
            echo '::error::Configure BTP_ENV_COMPARE_HMAC_KEY as a 64-character hex GitHub secret (generate with openssl rand -hex 32).'; exit 1;
          }
          [[ "${TECHNICAL_USER_EMAIL,,}" != "${SECOND_DIRECTORY_ADMIN_EMAIL,,}" ]] || {
            echo '::error::TECHNICAL_USER_EMAIL and SECOND_DIRECTORY_ADMIN_EMAIL must identify distinct BTP users.'; exit 1;
          }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}

      - name: Assert source matches trusted revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_SHA" ]] || { echo '::error::checkout did not match the pinned workflow revision'; exit 1; }

      - name: Compare BTP environment fingerprints (values withheld)
        env:
          BTP_ENV_COMPARE_HMAC_KEY: ${{ secrets.BTP_ENV_COMPARE_HMAC_KEY }}
          BTP_TECHNICAL_USER: ${{ secrets.BTP_TECHNICAL_USER }}
          CIS_CENTRAL_BINDING: ${{ secrets.CIS_CENTRAL_BINDING }}
          GLOBAL_ACCOUNT: ${{ vars.GLOBAL_ACCOUNT }}
          CLI_SERVER_URL: ${{ vars.CLI_SERVER_URL }}
          TECHNICAL_USER_EMAIL: ${{ secrets.TECHNICAL_USER_EMAIL }}
          SECOND_DIRECTORY_ADMIN_EMAIL: ${{ secrets.SECOND_DIRECTORY_ADMIN_EMAIL }}
        run: python3 benchmarks/btp/fingerprint-env.py

      - name: Check out pinned xp-diadromos actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gergely-szabo-sap/xp-diadromos
          ref: 46824c4140810cadb5d16ad215f28d2de93e1d38
          token: ${{ secrets.XP_DIADROMOS_RELEASE_TOKEN }}
          path: .github/actions/xp-diadromos
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build provider image
        run: make build BUILD_REGISTRY="$BUILD_REGISTRY" PLATFORMS="$PLATFORMS" VERSION="$VERSION"

      - name: Package provider for Crossplane
        run: make xpkg.build.provider-btp BUILD_REGISTRY="$BUILD_REGISTRY" PLATFORMS="$PLATFORMS" VERSION="$VERSION"

      - name: Validate exact single-image package
        id: package
        run: |
          set -euo pipefail
          package="_output/xpkg/linux_amd64/provider-btp-${VERSION}.xpkg"
          [[ -f "$package" && ! -L "$package" ]] || { echo '::error::expected exact provider package is missing'; exit 1; }
          size="$(stat -c '%s' "$package")"
          (( size > 0 && size <= 536870912 )) || { echo '::error::provider package exceeds the 512 MiB action limit'; exit 1; }
          manifest="$(tar -xOf "$package" manifest.json)"
          jq -e 'type == "array" and length == 1 and
            (.[0].Layers | type == "array" and length > 0)' <<<"$manifest" >/dev/null || {
            echo '::error::expected a single-image provider package'; exit 1;
          }
          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Run multi-resource BTP benchmark
        id: test
        uses: ./.github/actions/xp-diadromos/.github/actions/run-test
        with:
          config: benchmarks/btp/config.yaml
          cleanup: auto
          version: v0.7.1
          provider-artifact: ${{ steps.package.outputs.path }}
          provider-image: provider:v0
          release-token: ${{ secrets.XP_DIADROMOS_RELEASE_TOKEN }}
        env:
          GLOBAL_ACCOUNT: ${{ vars.GLOBAL_ACCOUNT }}
          CLI_SERVER_URL: ${{ vars.CLI_SERVER_URL }}
          BTP_TECHNICAL_USER: ${{ secrets.BTP_TECHNICAL_USER }}
          TECHNICAL_USER_EMAIL: ${{ secrets.TECHNICAL_USER_EMAIL }}
          SECOND_DIRECTORY_ADMIN_EMAIL: ${{ secrets.SECOND_DIRECTORY_ADMIN_EMAIL }}
          CIS_CENTRAL_BINDING: ${{ secrets.CIS_CENTRAL_BINDING }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

      - name: Publish available benchmark report
        id: report
        if: ${{ !cancelled() && steps.test.outputs.archive != '' }}
        uses: ./.github/actions/xp-diadromos/.github/actions/metrics-ci-report
        with:
          input: ${{ steps.test.outputs.archive }}
          version: v0.7.1
          release-token: ${{ secrets.XP_DIADROMOS_RELEASE_TOKEN }}
          presentation: benchmarks/btp/report-presentation.yaml
          artifact-name: btp-synthetic-benchmark-reports
          retention-days: 7

      - name: Verify published report contract
        id: verify
        if: ${{ !cancelled() && steps.report.outputs.report-json != '' }}
        run: ./benchmarks/btp/verify-report.sh "${{ steps.report.outputs.report-json }}"

      - name: Upload metrics archive
        id: archive
        if: ${{ !cancelled() && steps.test.outputs.archive != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: btp-synthetic-benchmark-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.test.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish benchmark archive comment on pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request_target' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ steps.archive.outputs.artifact-url }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          TEST_EXIT_CODE: ${{ steps.test.outputs.exit-code }}
        run: |
          set -euo pipefail
          if [[ -n "$ARTIFACT_URL" ]]; then
            archive_link="[Download the metrics archive]($ARTIFACT_URL) (available for 7 days; GitHub authentication and repository access are required)."
          else
            archive_link='_No downloadable metrics archive was published for this run._'
          fi
          body="$(cat <<EOF
          <!-- btp-synthetic-benchmark-archive -->
          ### BTP benchmark metrics archive

          $archive_link

          - Benchmark action outcome: \`${TEST_OUTCOME:-not started}\` (CLI exit code: \`${TEST_EXIT_CODE:-unavailable}\`).
          - Run: [${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - PR head revision tested: \`${PR_HEAD_SHA}\`.
          EOF
          )"
          existing_comment_id="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- btp-synthetic-benchmark-archive -->"))) | .id' \
            | tail -n 1)"
          if [[ -n "$existing_comment_id" ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$existing_comment_id" \
              -f body="$body" >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body" >/dev/null
          fi

      - name: Fail if no archive was produced
        if: ${{ !cancelled() && steps.test.outputs.archive == '' }}
        run: |
          echo '::error::Benchmark did not produce a reportable archive.'
          exit 1
