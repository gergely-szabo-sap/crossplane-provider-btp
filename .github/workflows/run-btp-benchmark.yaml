name: BTP synthetic benchmark

on:
  workflow_dispatch:
    inputs:
      confirm_dedicated_account:
        description: Confirm the dedicated BTP benchmark account is configured and safe to use
        required: true
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pr-notice:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain credentialed benchmark policy
        run: echo 'Fork PRs do not receive BTP credentials, so their benchmark is skipped. Automatic benchmarks run only for non-draft same-repository PRs targeting the default branch.'

  benchmark:
    concurrency:
      group: btp-benchmark-dedicated-account
      cancel-in-progress: false
    outputs:
      metrics_archive_url: ${{ steps.archive.outputs.artifact-url }}
      test_outcome: ${{ steps.test.outcome }}
      test_exit_code: ${{ steps.test.outputs.exit-code }}
      report_available: ${{ steps.report.outcome == 'success' && steps.report.outputs.report-markdown != '' }}
      report_mode: ${{ steps.baseline-validation.outcome == 'success' && steps.baseline-validation.outputs.baseline_mode || 'current-only' }}
      baseline_reason: ${{ (steps.baseline-validation.outcome == 'failure' || steps.baseline-resolution.outcome == 'failure' || steps.baseline-cli.outcome == 'failure') && 'baseline_validation_failed' || steps.baseline-validation.outputs.baseline_reason || steps.baseline-resolution.outputs.baseline_reason }}
      baseline_provenance: ${{ steps.baseline-validation.outputs.baseline_provenance || steps.baseline-resolution.outputs.baseline_provenance }}
      baseline_run_id: ${{ steps.baseline-resolution.outputs.baseline_run_id }}
      baseline_attempt: ${{ steps.baseline-resolution.outputs.baseline_attempt }}
      baseline_artifact_id: ${{ steps.baseline-resolution.outputs.baseline_artifact_id }}
      baseline_head_sha: ${{ steps.baseline-resolution.outputs.baseline_head_sha }}
    permissions:
      contents: read
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
         github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         !github.event.pull_request.draft &&
         github.event.pull_request.base.ref == github.event.repository.default_branch)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: pr-e2e-no-approval
      deployment: false
    env:
      VERSION: v0.0.0-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      BUILD_REGISTRY: provider-btp-benchmark
      PLATFORMS: linux_amd64
    steps:
      - name: Enforce trusted dispatch ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/${{ github.event.repository.default_branch }}" ]] || {
            echo '::error::Manual benchmark dispatch is allowed only from the default branch.'; exit 1;
          }
          [[ "${{ inputs.confirm_dedicated_account }}" == "true" ]] || {
            echo '::error::Confirm the dedicated BTP benchmark account before dispatch.'; exit 1;
          }

      - name: Validate benchmark account configuration
        env:
          GLOBAL_ACCOUNT: ${{ vars.GLOBAL_ACCOUNT }}
          CLI_SERVER_URL: ${{ vars.CLI_SERVER_URL }}
          TECHNICAL_USER_EMAIL: ${{ secrets.TECHNICAL_USER_EMAIL }}
          SECOND_DIRECTORY_ADMIN_EMAIL: ${{ secrets.SECOND_DIRECTORY_ADMIN_EMAIL }}
          BTP_ENV_COMPARE_HMAC_KEY: ${{ secrets.BTP_ENV_COMPARE_HMAC_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$GLOBAL_ACCOUNT" ]] || {
            echo '::error::Configure the GLOBAL_ACCOUNT environment variable to the dedicated global account subdomain.'; exit 1;
          }
          [[ -n "$CLI_SERVER_URL" ]] || {
            echo '::error::Configure the CLI_SERVER_URL environment variable for the benchmark BTP environment.'; exit 1;
          }
          [[ "$CLI_SERVER_URL" == https://* ]] || {
            echo '::error::CLI_SERVER_URL must be an HTTPS URL.'; exit 1;
          }
          [[ -n "$TECHNICAL_USER_EMAIL" ]] || {
            echo '::error::Configure the TECHNICAL_USER_EMAIL secret for the benchmark environment.'; exit 1;
          }
          [[ -n "$SECOND_DIRECTORY_ADMIN_EMAIL" ]] || {
            echo '::error::Configure the SECOND_DIRECTORY_ADMIN_EMAIL secret for the benchmark environment.'; exit 1;
          }
          [[ "$BTP_ENV_COMPARE_HMAC_KEY" =~ ^[[:xdigit:]]{64}$ ]] || {
            echo '::error::Configure BTP_ENV_COMPARE_HMAC_KEY as a 64-character hex GitHub secret (generate with openssl rand -hex 32).'; exit 1;
          }
          [[ "${TECHNICAL_USER_EMAIL,,}" != "${SECOND_DIRECTORY_ADMIN_EMAIL,,}" ]] || {
            echo '::error::TECHNICAL_USER_EMAIL and SECOND_DIRECTORY_ADMIN_EMAIL must identify distinct BTP users.'; exit 1;
          }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false

      - name: Assert source matches event revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$EXPECTED_SHA" ]] || { echo '::error::checkout did not match the pinned workflow revision'; exit 1; }

      - name: Compare BTP environment fingerprints (values withheld)
        env:
          BTP_ENV_COMPARE_HMAC_KEY: ${{ secrets.BTP_ENV_COMPARE_HMAC_KEY }}
          BTP_TECHNICAL_USER: ${{ secrets.BTP_TECHNICAL_USER }}
          CIS_CENTRAL_BINDING: ${{ secrets.CIS_CENTRAL_BINDING }}
          GLOBAL_ACCOUNT: ${{ vars.GLOBAL_ACCOUNT }}
          CLI_SERVER_URL: ${{ vars.CLI_SERVER_URL }}
          TECHNICAL_USER_EMAIL: ${{ secrets.TECHNICAL_USER_EMAIL }}
          SECOND_DIRECTORY_ADMIN_EMAIL: ${{ secrets.SECOND_DIRECTORY_ADMIN_EMAIL }}
        run: python3 benchmarks/btp/fingerprint-env.py

      - name: Check out pinned xp-diadromos actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gergely-szabo-sap/xp-diadromos
          ref: 986f84848429e28ee64db70af976c6d2a9472b4e
          token: ${{ secrets.XP_DIADROMOS_RELEASE_TOKEN }}
          path: .github/actions/xp-diadromos
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build provider image
        run: make build BUILD_REGISTRY="$BUILD_REGISTRY" PLATFORMS="$PLATFORMS" VERSION="$VERSION"

      - name: Package provider for Crossplane
        run: make xpkg.build.provider-btp BUILD_REGISTRY="$BUILD_REGISTRY" PLATFORMS="$PLATFORMS" VERSION="$VERSION"

      - name: Validate exact single-image package
        id: package
        run: |
          set -euo pipefail
          package="_output/xpkg/linux_amd64/provider-btp-${VERSION}.xpkg"
          [[ -f "$package" && ! -L "$package" ]] || { echo '::error::expected exact provider package is missing'; exit 1; }
          size="$(stat -c '%s' "$package")"
          (( size > 0 && size <= 536870912 )) || { echo '::error::provider package exceeds the 512 MiB action limit'; exit 1; }
          manifest="$(tar -xOf "$package" manifest.json)"
          jq -e 'type == "array" and length == 1 and
            (.[0].Layers | type == "array" and length > 0)' <<<"$manifest" >/dev/null || {
            echo '::error::expected a single-image provider package'; exit 1;
          }
          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Run multi-resource BTP benchmark
        id: test
        uses: ./.github/actions/xp-diadromos/.github/actions/run-test
        with:
          config: benchmarks/btp/config.yaml
          cleanup: auto
          version: v0.9.2
          provider-artifact: ${{ steps.package.outputs.path }}
          provider-image: provider:v0
          release-token: ${{ secrets.XP_DIADROMOS_RELEASE_TOKEN }}
        env:
          GLOBAL_ACCOUNT: ${{ vars.GLOBAL_ACCOUNT }}
          CLI_SERVER_URL: ${{ vars.CLI_SERVER_URL }}
          BTP_TECHNICAL_USER: ${{ secrets.BTP_TECHNICAL_USER }}
          TECHNICAL_USER_EMAIL: ${{ secrets.TECHNICAL_USER_EMAIL }}
          SECOND_DIRECTORY_ADMIN_EMAIL: ${{ secrets.SECOND_DIRECTORY_ADMIN_EMAIL }}
          CIS_CENTRAL_BINDING: ${{ secrets.CIS_CENTRAL_BINDING }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

      - name: Resolve checked-in benchmark baseline
        id: baseline-resolution
        if: ${{ !cancelled() && steps.test.outputs.archive != '' }}
        env:
          BTP_BENCHMARK_ENV_REVISION: ${{ vars.BTP_BENCHMARK_ENV_REVISION }}
        run: python3 benchmarks/btp/baseline-artifact.py resolve --reference benchmarks/btp/baseline-ref.json --workspace .

      - name: Install CLI for baseline preflight
        id: baseline-cli
        if: ${{ !cancelled() && steps.baseline-resolution.outputs.baseline_path != '' }}
        env:
          XP_METRICS_CI_VERSION: v0.9.2
          XP_METRICS_CI_RELEASE_TOKEN: ${{ secrets.XP_DIADROMOS_RELEASE_TOKEN }}
          XP_METRICS_CI_ACTION_PATH: ${{ github.workspace }}/.github/actions/xp-diadromos/.github/actions/metrics-ci-report
          RUNNER_OS: Linux
          RUNNER_ARCH: X64
          RUNNER_TEMP: ${{ runner.temp }}
        run: .github/actions/xp-diadromos/.github/actions/metrics-ci-report/install-cli.sh

      - name: Validate baseline and current report evidence
        id: baseline-validation
        if: ${{ !cancelled() && steps.baseline-resolution.outputs.baseline_path != '' && steps.test.outputs.archive != '' }}
        run: |
          set -euo pipefail
          python3 benchmarks/btp/baseline-artifact.py validate \
            --baseline "${{ steps.baseline-resolution.outputs.baseline_path }}" \
            --current "${{ steps.test.outputs.archive }}" \
            --report-cli "${{ steps.baseline-cli.outputs.binary }}" \
            --provenance "${{ steps.baseline-resolution.outputs.baseline_provenance }}" \
            --temp-dir "$RUNNER_TEMP"

      - name: Publish available benchmark report
        id: report
        if: ${{ !cancelled() && steps.test.outputs.archive != '' }}
        uses: ./.github/actions/xp-diadromos/.github/actions/metrics-ci-report
        with:
          input: ${{ steps.test.outputs.archive }}
          baseline: ${{ steps.baseline-validation.outputs.baseline_path }}
          version: v0.9.2
          release-token: ${{ secrets.XP_DIADROMOS_RELEASE_TOKEN }}
          presentation: benchmarks/btp/report-presentation.yaml
          artifact-name: btp-synthetic-benchmark-reports
          retention-days: 7

      - name: Verify published report contract
        id: verify
        if: ${{ !cancelled() && steps.report.outputs.report-json != '' }}
        run: |
          if [[ "${{ steps.baseline-validation.outcome == 'success' && steps.baseline-validation.outputs.baseline_mode || 'current-only' }}" == comparison ]]; then
            ./benchmarks/btp/verify-report.sh --comparison "${{ steps.report.outputs.report-json }}"
          else
            ./benchmarks/btp/verify-report.sh "${{ steps.report.outputs.report-json }}"
          fi

      - name: Record baseline status
        if: ${{ !cancelled() }}
        env:
          MODE: ${{ steps.baseline-validation.outcome == 'success' && steps.baseline-validation.outputs.baseline_mode || 'current-only' }}
          REASON: ${{ (steps.baseline-validation.outcome == 'failure' || steps.baseline-resolution.outcome == 'failure' || steps.baseline-cli.outcome == 'failure') && 'baseline_validation_failed' || steps.baseline-validation.outputs.baseline_reason || steps.baseline-resolution.outputs.baseline_reason }}
          PROVENANCE: ${{ steps.baseline-validation.outputs.baseline_provenance || steps.baseline-resolution.outputs.baseline_provenance }}
        run: |
          if [[ "$MODE" == comparison && -n "$PROVENANCE" ]]; then
            printf 'Baseline: checked-in archive from source run `%s`. This is not necessarily the PR base revision. Changes are rounded descriptive observations, not significance or causality claims.\n\n' "$PROVENANCE" >> "$GITHUB_STEP_SUMMARY"
          else
            case "$REASON" in
              baseline_validation_failed) message='baseline validation failed operationally' ;;
              invalid_reference) message='checked-in reference is invalid' ;;
              invalid_archive) message='checked-in archive failed validation' ;;
              incompatible_contract) message='benchmark contract is incompatible' ;;
              environment_revision_mismatch) message='benchmark environment revision does not match' ;;
              self_comparison) message='baseline and current run identities are not distinct' ;;
              identity_unavailable) message='run identity is unavailable' ;;
              unsuitable_evidence) message='checked-in archive lacks required evidence' ;;
              *) message='no checked-in baseline is configured' ;;
            esac
            printf 'Baseline unavailable — %s; showing current-only measurements.\n\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload metrics archive
        id: archive
        if: ${{ !cancelled() && steps.test.outputs.archive != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: btp-synthetic-benchmark-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.test.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Fail if no archive was produced
        if: ${{ !cancelled() && steps.test.outputs.archive == '' }}
        run: |
          echo '::error::Benchmark did not produce a reportable archive.'
          exit 1

  publish-archive-comment:
    needs: benchmark
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && needs.benchmark.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: none
      pull-requests: write
    steps:
      - name: Download published benchmark report
        if: ${{ needs.benchmark.outputs.report_available == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: btp-synthetic-benchmark-reports
          path: ${{ runner.temp }}/btp-synthetic-benchmark-reports

      - name: Prepare safe measurement table
        if: ${{ needs.benchmark.outputs.report_available == 'true' }}
        env:
          REPORT_PATH: ${{ runner.temp }}/btp-synthetic-benchmark-reports/benchmark-report.md
          TABLE_PATH: ${{ runner.temp }}/btp-synthetic-benchmark-table.md
          REPORT_MODE: ${{ needs.benchmark.outputs.report_mode }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          report_path = Path(os.environ["REPORT_PATH"])
          table_path = Path(os.environ["TABLE_PATH"])
          if not report_path.is_file() or report_path.is_symlink():
              raise SystemExit("published benchmark Markdown report is missing or unsafe")
          if report_path.stat().st_size > 65536:
              raise SystemExit("published benchmark Markdown report exceeds 64 KiB")

          label_pattern = re.compile(r"[A-Za-z][A-Za-z0-9 ()-]{0,119}\Z")
          number = r"-?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?(?:[eE][+-]?\d+)?"
          value_pattern = re.compile(rf"(?:{number}(?:\s(?:ms|count|cores|bytes|millicores|MiB))?|n/a|unavailable|Unavailable — [A-Za-z0-9 ,.;:-]{{1,200}})\Z", re.IGNORECASE)
          fixed_change_reasons = (
              "measurement definition differs between runs",
              "metric type differs between runs",
              "metric kind differs between runs",
              "distinct run identity is unavailable",
              "baseline and current identify the same run",
              "percentage change requires a strictly positive baseline",
              "change unavailable because a side cannot be represented in its display unit",
              "percentage change is outside the finite numeric range",
          )
          fixed_changes = {f"Unavailable — {reason}" for reason in fixed_change_reasons}
          change_pattern = re.compile(r"(?:[+-]?\d+\.\d%|n/a|unavailable|Unavailable — (?:baseline|current): [A-Za-z0-9 ,.;:_-]{1,180})\Z", re.IGNORECASE)
          mode = os.environ["REPORT_MODE"]
          headers = {
              "current-only": ("| Measurement | Value |", "| --- | ---: |", 2),
              "comparison": ("| Measurement | Baseline | Current | Change (%) |", "| --- | ---: | ---: | ---: |", 4),
          }
          if mode not in headers:
              raise SystemExit("benchmark report mode is invalid")
          header, separator, columns = headers[mode]
          lines = report_path.read_text(encoding="utf-8").splitlines()
          recognized = [i for i, line in enumerate(lines) if line.strip() in (headers["current-only"][0], headers["comparison"][0])]
          if len(recognized) != 1 or lines[recognized[0]].strip() != header:
              raise SystemExit("benchmark report table does not match the expected report mode")
          start = recognized[0]
          if start + 1 >= len(lines) or lines[start + 1].strip() != separator:
              raise SystemExit("benchmark report has an invalid table separator")
          rows = []
          for line in lines[start + 2:]:
              if not line.strip().startswith("|"):
                  break
              cells = [cell.strip() for cell in line.strip().strip("|").split("|")]
              cells[0] = cells[0].replace(r"\(", "(").replace(r"\)", ")")
              if len(cells) != columns or not label_pattern.fullmatch(cells[0]):
                  raise SystemExit("benchmark report contains an unexpected measurement row")
              valid = all(value_pattern.fullmatch(cell) for cell in cells[1:]) if mode == "current-only" else (
                  all(value_pattern.fullmatch(cell) for cell in cells[1:3])
                  and (change_pattern.fullmatch(cells[3]) is not None or cells[3] in fixed_changes)
              )
              if not valid:
                  raise SystemExit("benchmark report contains an unsafe measurement cell")
              rows.append("| " + " | ".join(cells) + " |")
          if len(rows) != 28:
              raise SystemExit("benchmark report must contain exactly 28 measurement rows")
          table_path.write_text(header + "\n" + separator + "\n" + "\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Publish benchmark archive link on pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ needs.benchmark.outputs.metrics_archive_url }}
          TABLE_PATH: ${{ runner.temp }}/btp-synthetic-benchmark-table.md
          REPORT_AVAILABLE: ${{ needs.benchmark.outputs.report_available }}
          TEST_OUTCOME: ${{ needs.benchmark.outputs.test_outcome }}
          TEST_EXIT_CODE: ${{ needs.benchmark.outputs.test_exit_code }}
          BASELINE_MODE: ${{ needs.benchmark.outputs.report_mode }}
          BASELINE_REASON: ${{ needs.benchmark.outputs.baseline_reason }}
          BASELINE_PROVENANCE: ${{ needs.benchmark.outputs.baseline_provenance }}
          BASELINE_RUN_ID: ${{ needs.benchmark.outputs.baseline_run_id }}
          BASELINE_ATTEMPT: ${{ needs.benchmark.outputs.baseline_attempt }}
          BASELINE_ARTIFACT_ID: ${{ needs.benchmark.outputs.baseline_artifact_id }}
          BASELINE_HEAD_SHA: ${{ needs.benchmark.outputs.baseline_head_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$ARTIFACT_URL" ]]; then
            archive_link="[Download the metrics archive]($ARTIFACT_URL) (available for 7 days; GitHub authentication and repository access are required)."
          else
            archive_link='_No downloadable metrics archive was published for this run._'
          fi
          if [[ "${REPORT_AVAILABLE:-false}" == "true" && -f "$TABLE_PATH" ]]; then
            measurements="$(<"$TABLE_PATH")"
          else
            measurements='_Measurement table unavailable; see the report artifact linked in the Actions run._'
          fi
          if [[ "$BASELINE_MODE" == comparison ]]; then
            [[ "$BASELINE_RUN_ID" =~ ^[1-9][0-9]*$ && "$BASELINE_ATTEMPT" =~ ^[1-9][0-9]*$ && "$BASELINE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$BASELINE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'Validated baseline provenance is malformed.' >&2; exit 1;
            }
            baseline_run_link="[source run $BASELINE_RUN_ID attempt $BASELINE_ATTEMPT]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN_ID)"
            baseline_note="Baseline: checked-in archive from $baseline_run_link; provider SHA \`$BASELINE_HEAD_SHA\`. $BASELINE_PROVENANCE. This may not be the PR base revision. Changes are rounded descriptive observations, not significance or causality claims. See the full report for context and resolved-Pod identity differences."
          else
            case "$BASELINE_REASON" in
              baseline_validation_failed) reason='baseline validation failed operationally' ;;
              invalid_reference) reason='checked-in reference is invalid' ;;
              invalid_archive) reason='checked-in archive failed validation' ;;
              incompatible_contract) reason='benchmark contract is incompatible' ;;
              environment_revision_mismatch) reason='benchmark environment revision does not match' ;;
              self_comparison) reason='baseline and current run identities are not distinct' ;;
              identity_unavailable) reason='run identity is unavailable' ;;
              unsuitable_evidence) reason='checked-in archive lacks required evidence' ;;
              *) reason='no checked-in baseline is configured' ;;
            esac
            baseline_note="Baseline unavailable — $reason; showing current-only measurements."
          fi
          body="$(cat <<EOF
          <!-- btp-synthetic-benchmark-archive -->
          ### BTP benchmark metrics archive

          $archive_link

          ### Measurements (report-only; status: not_evaluated)

          $baseline_note

          $measurements

          Readiness values summarize five client-observed samples per kind; Kubernetes object absence is not proof of remote BTP deletion. Provider utilization and observed reconciliation-error increases are descriptive, not performance or zero-error gates.

          - Benchmark action outcome: \`${TEST_OUTCOME:-not started}\` (CLI exit code: \`${TEST_EXIT_CODE:-unavailable}\`).
          - Run: [${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - PR head revision tested: \`${PR_HEAD_SHA}\`.
          EOF
          )"
          existing_comment_id="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- btp-synthetic-benchmark-archive -->"))) | .id' \
            | tail -n 1)"
          if [[ -n "$existing_comment_id" ]]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$existing_comment_id" \
              -f body="$body" >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$body" >/dev/null
          fi
